<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bogotá 3D — CORREGIDO V2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font:14px system-ui,Arial,sans-serif;background:#1a1a2e;color:#fff}
#globe{display:block;width:100vw;height:100vh}
#loading,#error{position:absolute;z-index:10;top:50%;left:50%;transform:translate(-50%,-50%);padding:1.2rem 1.6rem;background:#111d;color:#fff;border-radius:8px;max-width:85vw;text-align:center}
#error{display:none;background:#b62c23}
#info{position:absolute;top:12px;left:12px;z-index:5;background:#101826d9;padding:12px;border-radius:8px;max-width:330px;line-height:1.5}
#toolbar{position:absolute;right:12px;top:12px;z-index:5;display:flex;gap:8px}
button{padding:9px 12px;border:0;border-radius:6px;cursor:pointer;background:#fff;color:#172233}
#stats{position:absolute;bottom:12px;left:12px;z-index:5;background:#101826d9;padding:8px 11px;border-radius:6px;font-size:12px}
</style>
</head>
<body>
<canvas id="globe"></canvas>
<div id="loading">Cargando terreno 3D…</div>
<div id="error" role="alert"></div>
<div id="info"><strong>Bogotá 3D — Modelo Digital del Terreno 2025 (CORREGIDO V2)</strong><div>Sector de 5 tiles · Fuente: IDECA / UAECD</div><div>Visualización parcial, no toda Bogotá.</div></div>
<div id="toolbar"><button id="reset" type="button">Restablecer vista</button><button id="top" type="button">Vista superior</button></div>
<div id="stats">Esperando modelo…</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const canvas=document.getElementById('globe');
const loading=document.getElementById('loading');
const errorDiv=document.getElementById('error');
const stats=document.getElementById('stats');
const scene=new THREE.Scene();scene.background=new THREE.Color(0xa8cce6);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,1,1000000);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.08;controls.screenSpacePanning=true;
scene.add(new THREE.HemisphereLight(0xffffff,0x65716a,2));
const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(5000,10000,7000);scene.add(sun);
let terrain=null,bounds=null,size=null,center=null;
function showError(message){loading.style.display='none';errorDiv.textContent='Error al cargar el modelo: '+message;errorDiv.style.display='block';console.error(message)}
function fitView(top=false){if(!terrain||!size||!center)return;const dim=Math.max(size.x,size.y,size.z,1);const distance=dim*1.8;const direction=top?new THREE.Vector3(0,1,0):new THREE.Vector3(.6,.8,.65).normalize();camera.position.copy(center).addScaledVector(direction,distance);camera.up.set(0,0,-1);controls.target.copy(center);camera.near=Math.max(.1,distance/10000);camera.far=Math.max(100000,distance*10);camera.updateProjectionMatrix();controls.minDistance=Math.max(10,dim/100);controls.maxDistance=dim*8;controls.update()}
document.getElementById('reset').addEventListener('click',()=>fitView(false));
document.getElementById('top').addEventListener('click',()=>fitView(true));
async function loadTerrain(){try{
 const gltf=await new GLTFLoader().loadAsync('./bogota_3d_continuo.glb');
 terrain=gltf.scene;let meshCount=0,vertexCount=0;
 terrain.traverse(node=>{if(!node.isMesh)return;meshCount++;if(node.geometry?.attributes?.position)vertexCount+=node.geometry.attributes.position.count;node.frustumCulled=false;const mats=Array.isArray(node.material)?node.material:[node.material];for(const m of mats){if(m){m.side=THREE.DoubleSide;m.needsUpdate=true}}});
 if(!meshCount)throw new Error('El GLB no contiene mallas visibles.');
 scene.add(terrain);terrain.updateMatrixWorld(true);
 const originalBounds=new THREE.Box3().setFromObject(terrain);
 if(originalBounds.isEmpty())throw new Error('El GLB no tiene límites válidos.');
 const originalCenter=originalBounds.getCenter(new THREE.Vector3());
 // Centrar el grupo usando sus límites reales; conservar el relieve original.
 terrain.position.sub(originalCenter);terrain.updateMatrixWorld(true);
 bounds=new THREE.Box3().setFromObject(terrain);
 center=bounds.getCenter(new THREE.Vector3());
 size=bounds.getSize(new THREE.Vector3());
 if(![size.x,size.y,size.z].every(Number.isFinite)||Math.max(size.x,size.y,size.z)<=0)throw new Error('Dimensiones inválidas del modelo.');
 stats.textContent=`${meshCount} malla(s) · ${vertexCount.toLocaleString('es-CO')} vértices · ${Math.round(size.x/1000)} × ${Math.round(size.z/1000)} km aprox.`;
 fitView(false);loading.style.display='none';errorDiv.style.display='none';console.info('Modelo cargado',{meshCount,vertexCount,size,center});
 }catch(err){showError(err?.message||String(err));console.error(err)}}
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();loadTerrain();
</script>
</body>
</html>
